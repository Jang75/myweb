        }
        
        .notice {

            font-size: 14px;
            text-align: center;
            margin: 10px 20px;
        }
        
        /* 메인 레이아웃 */
        .container {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            gap: 20px;
        }
        
        /* 메인 비디오 영역 */
        .main-video-area {
            flex: 2;
        }
        
        .main-video-container {
            background-color: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        .main-video {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000;
            position: relative;
        }

        .main-video-link, .main-video-thumb {
            display: block;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .main-video-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .main-play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            text-shadow: 0 0 20px rgba(0,0,0,0.8);

        }
        
        .video-info {

        }
        
        .video-title {

        }
        
        .video-description {
            color: #aaa;
            font-size: 15px;
            line-height: 1.6;
        }
        
        /* 사이드바 (리스트 영역) */
        .sidebar {
            flex: 1;
            min-width: 350px;
            background-color: #0f0f0f;
        }
        
        .menu-buttons {
            display: flex;
            margin-bottom: 20px;
            background-color: #222;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .menu-btn {
            flex: 1;
            padding: 12px 0;
            background: none;
            border: none;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .menu-btn.active {
            background-color: #ff0000;
            font-weight: bold;
        }
        
        .menu-btn:hover {
            background-color: #333;
        }
        
        .video-list {
            max-height: 80vh;
            overflow-y: auto;
            padding-right: 5px;
        }
        
        .video-item {
            display: flex;
            margin-bottom: 15px;
            background-color: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }
        
        .video-item:hover {
            transform: translateY(-2px);
            background-color: #2a2a2a;
        }
        
        .video-item.active {
            border: 2px solid #ff0000;
        }
        
        .thumbnail {
            width: 160px;
            height: 90px;
            background-color: #333;
            flex-shrink: 0;
            position: relative;
        }
        
        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 24px;
            opacity: 0;
            transition: opacity 0.3s;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        .video-item:hover .play-icon {
            opacity: 1;
        }
        
        .item-info {
            padding: 10px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .item-title {
            font-size: 14px;
            margin-bottom: 6px;
            color: #fff;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .item-type {
            display: inline-block;
            background-color: #ff0000;
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 3px;
            align-self: flex-start;
            margin-bottom: 4px;
        }

        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ff0000;
        }

        /* -------------------------------------------------------- */
        /* ★★★ [신규] 전화걸기 플로팅 버튼 스타일 ★★★ */
        /* -------------------------------------------------------- */
        .call-btn-fixed {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 65px;
            height: 65px;
            background-color: #00c853; /* 통화 상징 초록색 */
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            z-index: 9999; /* 제일 위에 뜨도록 */
            text-decoration: none;
            animation: pulse 2s infinite; /* 두근거리는 효과 */
            transition: transform 0.3s;
        }

        .call-btn-fixed:hover {
            transform: scale(1.1);
        }

        /* 두근두근 애니메이션 정의 */
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(0, 200, 83, 0.7);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(0, 200, 83, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(0, 200, 83, 0);
            }
        }

        /* -------------------------------------------------------- */
        /* ★★★ 모바일 전용 스타일 (스마트폰용 UI) ★★★ */

        @media (max-width: 768px) {
            .header {

            }
            .header-info p {

            }
            
            .notice {
                margin: 0;
                border-radius: 0;

                border-right: none;
                font-size: 13px;
            }

            .container {

                padding: 0;
                gap: 0;
            }

            .main-video-area {

                margin-bottom: 10px;
                box-shadow: none;
            }
            
            .video-info {
                padding: 10px 15px;
            }
            
            .video-title {
                font-size: 18px;
            }

            .current-info {
                padding: 0 15px;
                margin-bottom: 10px;
            }

            .sidebar {
                width: 100%;
                background-color: #0f0f0f;
            }

            .menu-buttons {
                background: transparent;
                border-radius: 0;
                margin: 10px 15px 15px 15px;
                overflow-x: auto;
                white-space: nowrap;
                display: flex;
                gap: 8px;
                padding-bottom: 5px;
            }

            .menu-btn {
                flex: none;
                padding: 8px 16px;
                background-color: #222;
                border: 1px solid #333;
                border-radius: 20px;
                font-size: 14px;
                color: #fff;
            }

            .menu-btn.active {
                background-color: #fff;
                color: #000;
                border-color: #fff;
                font-weight: 600;
            }

            .video-list {
                max-height: none;
                overflow-y: visible;
                padding: 0 15px 80px 15px; /* 전화버튼 공간 확보를 위해 하단 여백 추가 */
            }

            .video-item {
                flex-direction: column;
                background-color: transparent;
                margin-bottom: 25px;
                border-radius: 0;
            }

            .video-item:hover {
                background-color: transparent;
                transform: none;
            }
            
            .video-item.active {
                border: none;
            }
            .video-item.active .item-title {
                color: #ff0000;
            }

            .thumbnail {
                width: 100%;
                height: auto;
                aspect-ratio: 16/9;
                border-radius: 8px;
                margin-bottom: 10px;
            }

            .play-icon {
                font-size: 40px;
                opacity: 0.8;
            }

            .item-info {
                padding: 0 5px;
            }

            .item-title {
                font-size: 16px;
                line-height: 1.4;
                margin-bottom: 8px;
            }
            
            .item-type {
                margin-bottom: 6px;
            }
        }
    </style>

            { id: 4, title: "신 손오공포커  <br>[백기사] 010.7350.8836", youtubeId: "9k5otGlzlTo", type: "recommended", desc: "백기사 010.7350.8836" },
            { id: 5, title: "대 서 양 <br>[백기사] 010.7350.8836", youtubeId: "ATewh_UcF1w", type: "recommended", desc: "백기사 010.7350.8836" },            
            { id: 6, title: "뉴 황금성K<br> [백기사] 010.7350.8836", youtubeId: "6Rrx0iNyGQ4", type: "popular", desc: "백기사 010.7350.8836" },
            { id: 7, title: "태 평 양 <br>[백기사] 010.7350.8836", youtubeId: "b3kiTaCk40g", type: "recommended", desc: "백기사 010.7350.8836" },
            { id: 8, title: "고진감래 <br>[백기사] 010.7350.8836", youtubeId: "sp1r9rOqHWM", type: "recommended", desc: "백기사 010.7350.8836" },
            { id: 9, title: "불 용 5 <br>[백기사] 010.7350.8836", youtubeId: "yWpBrmS4qRI", type: "recommended", desc: "백기사 010.7350.8836" },
            { id: 10, title: "삼 순 이 <br>[백기사] 010.7350.8836", youtubeId: "4NGGL0bHTLw", type: "recommended", desc: "백기사 010.7350.8836" },
            { id: 11, title: "드래곤플라이<br>[백기사] 010.7350.8836", youtubeId: "V-h3L8uCIsg", type: "recommended", desc: "백기사 010.7350.8836" },
            { id: 12, title: "슈퍼회오리2<br> [백기사] 010.7350.8836", youtubeId: "xicvo7ayTyY", type: "recommended", desc: "백기사 010.7350.8836" },
            { id: 13, title: "아 테 네<br> [백기사] 010.7350.8836", youtubeId: "8e8VBzSe2Iw", type: "recommended", desc: "백기사 010.7350.8836" },           
            { id: 14, title: "사 천 성 <br>[백기사] 010.7350.8836 ", youtubeId: "9DXhV1QmmN8", type: "recommended", desc: "백기사 010.7350.8836" },
            { id: 15, title: "요술램프<br> [백기사] 010.7350.8836", youtubeId: "y0XM3weVEkQ", type: "recommended", desc: "백기사 010.7350.8836" },
            { id: 16, title: "오 공 주 <br>[백기사] 010.7350.8836 ", youtubeId: "ApG2xnSK7pY", type: "recommended", desc: "백기사 010.7350.8836" },
            { id: 17, title: "마스터2 <br>[백기사] 010.7350.8836", youtubeId: "2vsKx7P0XAg", type: "recommended", desc: "백기사 010.7350.8836" },
            { id: 18, title: "팬텀 <br>[백기사] 010.7350.8836", youtubeId: "XVj50axyK2o", type: "recommended", desc: "백기사 010.7350.8836" }
            
        ];

        const videoListElement = document.getElementById('videoList');
        const mainVideoPlayer = document.getElementById('mainVideoPlayer');
        const mainVideoTitle = document.getElementById('mainVideoTitle');
        const mainVideoDesc = document.getElementById('mainVideoDesc');
        const menuButtons = document.querySelectorAll('.menu-btn');
        const currentCountElement = document.getElementById('currentCount');
        const filteredCountElement = document.getElementById('filteredCount');
        
        let currentFilter = 'all';
        let activeVideoId = null;
        
        document.addEventListener('DOMContentLoaded', function() {
            if (gameVideos.length === 0) return;
            currentCountElement.textContent = gameVideos.length;
            const randomIndex = Math.floor(Math.random() * gameVideos.length);
            loadVideo(gameVideos[randomIndex]);
        });
        
        function getFilteredVideos() {
            if (currentFilter === 'all') return gameVideos;
            return gameVideos.filter(video => video.type === currentFilter);
        }

        function renderVideoList() {
            videoListElement.innerHTML = '';
            const filteredVideos = getFilteredVideos();
            
            filteredVideos.forEach(video => {
                const videoItem = document.createElement('div');
                videoItem.className = `video-item ${activeVideoId === video.id ? 'active' : ''}`;
                videoItem.dataset.id = video.id;
                
                const thumbnailUrl = `https://img.youtube.com/vi/${video.youtubeId}/hqdefault.jpg`;
                
                videoItem.innerHTML = `
                    <div class="thumbnail">
                        <img src="${thumbnailUrl}" alt="${video.title}" onerror="this.src='https://via.placeholder.com/160x90/333/fff?text=Thumbnail'">
                        <div class="play-icon"><i class="fas fa-play-circle"></i></div>
                    </div>
                    <div class="item-info">
                        <div class="item-type">${video.type === 'popular' ? '인기' : '추천'}</div>
                        <div class="item-title">${video.title}</div>
                    </div>
                `;
                
                videoItem.addEventListener('click', () => {
                    loadVideo(video);
                    if (window.innerWidth <= 768) {
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                });
                
                videoListElement.appendChild(videoItem);
            });
            updateFilteredCount();
        }
        
        function loadVideo(video) {
            activeVideoId = video.id;
            const thumbUrl = `https://img.youtube.com/vi/${video.youtubeId}/hqdefault.jpg`;

            mainVideoPlayer.innerHTML = `
                <a href="https://www.youtube.com/watch?v=${video.youtubeId}" target="_blank" class="main-video-link">
                    <div class="main-video-thumb">
                        <img src="${thumbUrl}" alt="${video.title}" onerror="this.src='https://via.placeholder.com/640x360/333/fff?text=No+Image'">
                        <div class="main-play-overlay">
                            <i class="fas fa-play-circle"></i>
                            <span>재생</span>
                        </div>
                    </div>
                </a>
            `;
            
            mainVideoTitle.innerHTML = video.title;
            mainVideoDesc.textContent = video.desc;
            renderVideoList();
        }
        
        menuButtons.forEach(button => {
            button.addEventListener('click', function() {
                menuButtons.forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                renderVideoList();
            });
        });
        
        function updateFilteredCount() {
            const filteredVideos = getFilteredVideos();
            currentCountElement.textContent = gameVideos.length;
            filteredCountElement.textContent = filteredVideos.length;
        }
    </script>
</body>

</html>
