        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Malgun Gothic', 'Segoe UI', sans-serif;
        }
        
        body {
            background-color: #0f0f0f;
            color: #f1f1f1;
        }
        
        /* 헤더 */
        .header {
            background-color: #000;
            padding: 15px 20px;
            border-bottom: 2px solid #ff0000;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .logo {
            display: flex;
            align-items: center;
        }
        
        .logo h1 {
            color: #ff0000;
            font-size: 22px;
            margin-left: 10px;
        }
        
        .logo-icon {
            color: #ff0000;
            font-size: 28px;
        }
        
        .notice {
            background-color: rgba(255, 0, 0, 0.1);
            border: 1px solid #ff0000;
            border-radius: 6px;
            padding: 8px 15px;
            font-size: 14px;
            text-align: center;
            margin: 10px 20px;
        }
        
        /* 메인 레이아웃 */
        .container {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* 메인 비디오 영역 */
        .main-video-area {
            flex: 1;
            margin-right: 20px;
        }
        
        .main-video-container {
            background-color: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        
        .main-video {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .main-video-link {
            display: block;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .main-video-thumb {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .main-video-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .main-play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            text-shadow: 0 0 10px rgba(0,0,0,0.7);
        }

        .main-play-overlay i {
            font-size: 70px;
            margin-bottom: 10px;
            display: block;
        }

        .main-play-overlay span {
            font-size: 16px;
            background: rgba(0,0,0,0.5);
            padding: 6px 12px;
            border-radius: 20px;
        }
        
        .video-placeholder {
            color: #aaa;
            text-align: center;
        }
        
        .video-placeholder i {
            font-size: 60px;
            margin-bottom: 15px;
            display: block;
            color: #ff0000;
        }
        
        .video-info {
            padding: 15px;
        }
        
        .video-title {
            font-size: 20px;
            margin-bottom: 10px;
            color: #fff;
        }
        
        .video-description {
            color: #aaa;
            font-size: 14px;
            line-height: 1.5;
        }
        
        /* 사이드바 */
        .sidebar {
            width: 350px;
            background-color: #0f0f0f;
        }
        
        .menu-buttons {
            display: flex;
            margin-bottom: 20px;
            background-color: #222;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .menu-btn {
            flex: 1;
            padding: 12px 0;
            background: none;
            border: none;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .menu-btn.active {
            background-color: #ff0000;
            font-weight: bold;
        }
        
        .menu-btn:hover {
            background-color: #333;
        }
        
        .video-list {
            max-height: 70vh;
            overflow-y: auto;
            padding-right: 10px;
        }
        
        /* 비디오 리스트 아이템 */
        .video-item {
            display: flex;
            margin-bottom: 15px;
            background-color: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s, border 0.2s;
        }
        
        .video-item:hover {
            transform: translateY(-3px);
            background-color: #222;
        }
        
        .video-item.active {
            border: 2px solid #ff0000;
        }
        
        .thumbnail {
            width: 160px;
            height: 90px;
            background-color: #333;
            flex-shrink: 0;
            position: relative;
        }
        
        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 24px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .video-item:hover .play-icon {
            opacity: 1;
        }
        
        .item-info {
            padding: 10px;
            flex: 1;
        }
        
        .item-title {
            font-size: 14px;
            margin-bottom: 5px;
            color: #fff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .item-type {
            display: inline-block;
            background-color: #ff0000;
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 3px;
            margin-bottom: 5px;
        }

        .current-info {
            padding: 5px 0 0 5px;
        }

        /* 반응형 디자인 */
        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
                padding: 15px;
            }
            
            .main-video-area {
                margin-right: 0;
                margin-bottom: 20px;
            }
            
            .sidebar {
                width: 100%;
            }
            
            .video-list {
                max-height: 400px;
            }
        }
        
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
                padding: 15px;
            }
            
            .logo {
                margin-bottom: 10px;
            }
            
            .thumbnail {
                width: 120px;
                height: 70px;
            }
        }
        
        /* 스크롤바 스타일 */
        .video-list::-webkit-scrollbar {
            width: 8px;
        }
        
        .video-list::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-radius: 4px;
        }
        
        .video-list::-webkit-scrollbar-thumb {
            background: #ff0000;
            border-radius: 4px;
        }
        
        .video-list::-webkit-scrollbar-thumb:hover {
            background: #cc0000;
        }
    </style>

            },
            {

            },
            {

                youtubeId: "9DXhV1QmmN8",   // 9DXhV1QmmN8&t=4s → 9DXhV1QmmN8
                type: "recommended", 
                desc: "백기사 010.7350.8836"
            },
            { 
                id: 16, 
                title: "요술램프<br> [백기사] 010.7350.8836", 
                youtubeId: "y0XM3weVEkQ",

                desc: "백기사 010.7350.8836"
            },
            { 
                id: 17, 
                title: "대 서 양 <br>[백기사] 010.7350.8836", 
                youtubeId: "ATewh_UcF1w",   // ATewh_UcF1w&t=1s → ATewh_UcF1w
                type: "recommended", 
                desc: "백기사 010.7350.8836"
            }
            { 
                id: 18, 
                title: "오 공 주 <br>[백기사] 010.7350.8836 ", 
                youtubeId: "ApG2xnSK7pY",   // 9DXhV1QmmN8&t=4s → 9DXhV1QmmN8
                type: "recommended", 
                desc: "백기사 010.7350.8836"
            }
            
        ];

        // DOM 요소
        const videoListElement = document.getElementById('videoList');
        const mainVideoPlayer = document.getElementById('mainVideoPlayer');
        const videoPlaceholder = document.getElementById('videoPlaceholder');
        const mainVideoTitle = document.getElementById('mainVideoTitle');
        const mainVideoDesc = document.getElementById('mainVideoDesc');
        const menuButtons = document.querySelectorAll('.menu-btn');
        const currentCountElement = document.getElementById('currentCount');
        const filteredCountElement = document.getElementById('filteredCount');
        
        let currentFilter = 'all';
        let activeVideoId = null;
        
        // 페이지 로드 시 초기화
        document.addEventListener('DOMContentLoaded', function() {
            if (gameVideos.length === 0) return;

            // 전체 개수 (기본은 전체 영상 기준)
            currentCountElement.textContent = gameVideos.length;
            
            // ★ 첫 페이지에서 랜덤 영상 선택 ★
            const randomIndex = Math.floor(Math.random() * gameVideos.length);
            loadVideo(gameVideos[randomIndex]);
        });
        
        // 현재 필터에 맞는 전체 목록
        function getFilteredVideos() {
            if (currentFilter === 'all') return gameVideos;
            return gameVideos.filter(video => video.type === currentFilter);
        }

        // 영상 목록 렌더링 함수 (필터된 영상 전부 표시)
        function renderVideoList() {
            videoListElement.innerHTML = '';
            
            const filteredVideos = getFilteredVideos();
            
            filteredVideos.forEach(video => {
                const videoItem = document.createElement('div');
                videoItem.className = `video-item ${activeVideoId === video.id ? 'active' : ''}`;
                videoItem.dataset.id = video.id;
                
                const thumbnailUrl = `https://img.youtube.com/vi/${video.youtubeId}/hqdefault.jpg`;
                
                videoItem.innerHTML = `
                    <div class="thumbnail">
                        <img src="${thumbnailUrl}" alt="${video.title}" onerror="this.src='https://via.placeholder.com/160x90/333/fff?text=Thumbnail'">
                        <div class="play-icon"><i class="fas fa-play-circle"></i></div>
                    </div>
                    <div class="item-info">
                        <div class="item-type">${video.type === 'popular' ? '인기 게임' : '추천 게임'}</div>
                        <div class="item-title">${video.title}</div>
                    </div>
                `;
                
                // 클릭 이벤트: 메인 플레이어 업데이트
                videoItem.addEventListener('click', () => {
                    loadVideo(video);
                });
                
                videoListElement.appendChild(videoItem);
            });

            updateFilteredCount();
        }
        
        // 영상 로드 함수 (임베드 대신 썸네일 + 유튜브 링크)
        function loadVideo(video) {
            activeVideoId = video.id;

            if (videoPlaceholder) {
                videoPlaceholder.remove();
            }

            const thumbUrl = `https://img.youtube.com/vi/${video.youtubeId}/hqdefault.jpg`;

            mainVideoPlayer.innerHTML = `
                <a href="https://www.youtube.com/watch?v=${video.youtubeId}" 
                   target="_blank" 
                   class="main-video-link">
                    <div class="main-video-thumb">
                        <img src="${thumbUrl}" alt="${video.title}" 
                             onerror="this.src='https://via.placeholder.com/640x360/333/fff?text=No+Image'">
                        <div class="main-play-overlay">
                            <i class="fas fa-play-circle"></i>
                            <span>유튜브에서 재생</span>
                        </div>
                    </div>
                </a>
            `;
            
            mainVideoTitle.innerHTML = video.title;
            mainVideoDesc.textContent = video.desc;
            
            renderVideoList();
        }
        
        // 메뉴 버튼 클릭 이벤트
        menuButtons.forEach(button => {
            button.addEventListener('click', function() {
                menuButtons.forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
                
                currentFilter = this.dataset.filter;
                
                renderVideoList();
            });
        });
        
        // 개수 표시 업데이트
        function updateFilteredCount() {
            const filteredVideos = getFilteredVideos();
            currentCountElement.textContent = filteredVideos.length; // 현재 필터의 전체 개수
            filteredCountElement.textContent = filteredVideos.length; // 화면에 보이는 개수(전부)
        }
    </script>
</body>
</html>
